name: security
on: workflow_dispatch
permissions:
  actions: read
  security-events: write
  contents: read
jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@c51854704019a247608d928f370c98740469d4b5
        with:
          scan-args: |-
            --format sarif
            --output DependenciesAnalysisFull.sarif
            ./
        continue-on-error: true
      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: DependenciesAnalysisFull.sarif
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:326e5f41cc972bb423b764a14febbb62bbad29ee1c01820805d077dd868fea48
    steps:
      - uses: actions/checkout@v6
      - run: semgrep scan --config .semgrep/ --sarif --output semgrep.sarif src/
      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
